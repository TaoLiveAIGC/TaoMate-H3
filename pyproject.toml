[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taomate-h3"
version = "0.1.0"
description = "Streaming text, first/last-frame and reference audio-video inference for MiniMax H3"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [{name = "TaoMate-H3 Contributors"}]
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "diffusers==0.36.0",
  "einops>=0.7",
  "huggingface-hub>=0.34",
  "numpy==1.26.4",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy==1.14.0",
  "sentencepiece==0.1.96",
  "safetensors>=0.4.5",
  "tokenizers==0.22.1",
  "transformers==4.57.6",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src", "src/taomate-fl2av/src"]
include = ["taomate_h3", "taomate_h3.*", "digitalhuman_h3", "digitalhuman_h3.*"]
namespaces = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
